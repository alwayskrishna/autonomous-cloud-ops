name: .NET CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore tests/AutonomousCloudOps.Tests/AutonomousCloudOps.Tests.csproj
      - name: Test
        run: dotnet test tests/AutonomousCloudOps.Tests/AutonomousCloudOps.Tests.csproj --no-restore --configuration Release
      - name: Test management API
        run: dotnet test tests/AutonomousCloudOps.Api.Tests/AutonomousCloudOps.Api.Tests.csproj --configuration Release
      - name: Build CLI
        run: dotnet build src/AutonomousCloudOps.Cli/AutonomousCloudOps.Cli.csproj --configuration Release
      - name: Run offline demo
        run: dotnet run --project src/AutonomousCloudOps.Cli/AutonomousCloudOps.Cli.csproj --configuration Release --no-build
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Build local-only container image
        run: docker build --tag autonomous-cloud-ops:ci .
      - name: Validate Bicep template syntax
        uses: azure/cli@v2
        with:
          inlineScript: az bicep build --file infra/main.bicep
      - name: Build offline load benchmark
        run: dotnet build benchmarks/AutonomousCloudOps.Benchmarks/AutonomousCloudOps.Benchmarks.csproj --configuration Release
      - name: Run bounded synthetic load benchmark
        run: dotnet run --project benchmarks/AutonomousCloudOps.Benchmarks/AutonomousCloudOps.Benchmarks.csproj --configuration Release --no-build -- 10000
